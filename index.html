<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Game By Vote · Day 0</title>
<meta name="description" content="A game built by AI, where Instagram followers vote on what it becomes.">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#1f1630;color:#fff;font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column}
  #game{flex:1;width:100%;border:0;display:block}
  nav{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#1f1630;align-items:center}
  nav span{font-size:12px;opacity:.8;margin-right:auto;line-height:1.3}
  nav b{display:block;font-size:13px;opacity:1}
  button{font:inherit;font-weight:bold;font-size:14px;border:0;border-radius:12px;padding:10px 12px;background:#3a2e4d;color:#fff;cursor:pointer}
  button[aria-pressed="true"]{background:#ffcf5c;color:#1f1630}
</style>
</head>
<body>
<iframe id="game" title="Mochi" src="styles/pixel.html"></iframe>
<nav>
  <span><b>Day 0 · pick Mochi's look</b>Vote on Instagram @gamebyvote</span>
  <button data-s="pixel" aria-pressed="true">A Pixel</button>
  <button data-s="cartoon" aria-pressed="false">B Cartoon</button>
  <button data-s="clay" aria-pressed="false">C Clay</button>
</nav>
<script>
  const game = document.getElementById('game'), btns = document.querySelectorAll('nav button');
  function pick(s) {
    game.src = 'styles/' + s + '.html';
    btns.forEach(b => b.setAttribute('aria-pressed', b.dataset.s === s));
    try { history.replaceState(null, '', '#' + s); } catch (e) {}
  }
  btns.forEach(b => b.addEventListener('click', () => pick(b.dataset.s)));
  const start = location.hash.slice(1);
  if (['pixel', 'cartoon', 'clay'].includes(start)) pick(start);
</script>
</body>
</html>
