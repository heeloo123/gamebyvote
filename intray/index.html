<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b1d3a">
<title>Kelvin's In-Tray · Game By Vote</title>
<style>
  @font-face{font-family:"P";src:url(./press-start-2p.woff2) format("woff2");font-display:block}
  html,body{margin:0;height:100%;overflow:hidden;background:#2b1d3a;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{position:absolute;inset:0;margin:auto;display:block}
  #over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#1f1630cc;font-family:"P",monospace;z-index:2}
  #over.on{display:flex}
  .paper{background:#f6f3e8;color:#2b1d3a;border:3px solid #2b1d3a;width:min(86%,330px);padding:18px 14px 26px;text-align:center;font-size:10px;line-height:1.9;box-shadow:0 6px 0 #0006;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),94% 100%,88% calc(100% - 8px),82% 100%,76% calc(100% - 8px),70% 100%,64% calc(100% - 8px),58% 100%,52% calc(100% - 8px),46% 100%,40% calc(100% - 8px),34% 100%,28% calc(100% - 8px),22% 100%,16% calc(100% - 8px),10% 100%,4% calc(100% - 8px),0 100%)}
  .paper h1{font-size:20px;color:#d9443a;margin:4px 0 8px}
  .paper .big{font-size:16px;margin:6px 0}
  .paper button{display:block;width:100%;font:inherit;font-size:11px;margin-top:10px;border:3px solid #2b1d3a;border-radius:9px;background:#ffcf5c;color:#2b1d3a;padding:12px 6px;box-shadow:0 4px 0 #2b1d3a;cursor:pointer}
  .paper button.alt{background:#fff}
  .paper .em{font-family:system-ui,"Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:22px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="over"><div class="paper" id="card"></div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
