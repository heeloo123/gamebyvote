<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Mochi · Style C · Clay 3D</title>
<style>
  :root{--ink:#3d3550}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;user-select:none;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
  body{background:radial-gradient(120% 70% at 50% 30%,#eaf6ff 0,#cfe6ff 45%,#b9d7f7 100%);display:flex;flex-direction:column;align-items:center}
  /* soft rounded floor */
  .floor{position:absolute;left:-20%;right:-20%;bottom:-18%;height:52%;border-radius:50% 50% 0 0;
         background:radial-gradient(70% 60% at 50% 20%,#d9f2c9 0,#b6e2a1 55%,#97cf83 100%);box-shadow:inset 0 18px 30px #ffffff66}
  header{position:relative;margin-top:4vh;text-align:center;z-index:1}
  .tag{display:inline-block;background:linear-gradient(#ffffff,#eef3ff);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:bold;
       box-shadow:0 3px 0 #a9b9d6,0 6px 12px #5a73a033}
  h1{margin:10px 0 0;font-size:clamp(28px,7.5vw,42px);letter-spacing:1px;color:#fff;
     text-shadow:0 2px 0 #9fb2d6,0 4px 0 #8aa0c8,0 8px 14px #4d628f55}
  #mood{margin-top:6px;font-size:16px;min-height:22px;font-weight:bold}
  .bar{width:min(70vw,280px);height:18px;margin:8px auto 0;border-radius:999px;padding:3px;
       background:linear-gradient(#c8d6ee,#e9f0fb);box-shadow:inset 0 2px 4px #5a73a055}
  .fill{height:100%;width:0;border-radius:999px;transition:width .25s;
        background:linear-gradient(#ffd0de,#ff8fb0 60%,#f2729a);box-shadow:inset 0 2px 0 #ffffff99}
  #stage{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center;z-index:1}
  #pet{width:min(58vw,240px);cursor:pointer}
  #pet.bounce{animation:boing .38s}
  @keyframes boing{0%{transform:scale(1,1)}30%{transform:scale(1.14,.86)}60%{transform:scale(.93,1.09)}100%{transform:scale(1,1)}}
  #pet.idle{animation:breathe 2.6s ease-in-out infinite}
  @keyframes breathe{50%{transform:translateY(-7px) scale(1.01,.99)}}
  .heart{position:absolute;pointer-events:none;width:30px;height:30px;animation:float 1.1s ease-out forwards;z-index:2}
  @keyframes float{to{transform:translateY(-130px) scale(1.5) rotate(12deg);opacity:0}}
  footer{position:relative;z-index:1;margin-bottom:5vh;text-align:center;font-size:14px;font-weight:bold;
         background:linear-gradient(#ffffffee,#f1f6ffee);padding:10px 18px;border-radius:18px;box-shadow:0 4px 0 #a9c99a,0 8px 18px #2f5a2a33}
</style>
</head>
<body>
<div class="floor"></div>
<header>
  <span class="tag">DAY 0 · @gamebyvote</span>
  <h1>Mochi</h1>
  <div id="mood">Tap me!</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
</header>
<div id="stage">
  <svg id="pet" class="idle" viewBox="0 0 200 190" aria-label="Mochi in clay style">
    <defs>
      <radialGradient id="body" cx="38%" cy="32%" r="75%">
        <stop offset="0" stop-color="#fffbe0"/><stop offset=".45" stop-color="#ffe98a"/>
        <stop offset=".85" stop-color="#f3c64a"/><stop offset="1" stop-color="#d9a52f"/>
      </radialGradient>
      <radialGradient id="ear" cx="40%" cy="35%" r="70%">
        <stop offset="0" stop-color="#fff6c9"/><stop offset="1" stop-color="#ecbd45"/>
      </radialGradient>
      <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#ff8fb0" stop-opacity=".9"/><stop offset="1" stop-color="#ff8fb0" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#2f5a2a" stop-opacity=".45"/><stop offset="1" stop-color="#2f5a2a" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5a4f72"/><stop offset="1" stop-color="#2b2440"/>
      </linearGradient>
    </defs>
    <ellipse cx="100" cy="172" rx="70" ry="12" fill="url(#shadow)"/>
    <path d="M58 58 Q46 18 70 26 Q84 32 82 54Z" fill="url(#ear)"/>
    <path d="M142 58 Q154 18 130 26 Q116 32 118 54Z" fill="url(#ear)"/>
    <path d="M28 118 Q28 42 100 42 Q172 42 172 118 Q172 168 100 168 Q28 168 28 118Z" fill="url(#body)"/>
    <ellipse cx="72" cy="70" rx="22" ry="12" fill="#ffffff" opacity=".55" transform="rotate(-18 72 70)"/>
    <ellipse cx="62" cy="64" rx="7" ry="4" fill="#ffffff" opacity=".9" transform="rotate(-18 62 64)"/>
    <g id="eyes">
      <ellipse cx="76" cy="102" rx="9" ry="12" fill="url(#eye)"/><ellipse cx="124" cy="102" rx="9" ry="12" fill="url(#eye)"/>
      <circle cx="79" cy="97" r="3.5" fill="#fff"/><circle cx="127" cy="97" r="3.5" fill="#fff"/>
    </g>
    <g id="happyeyes" style="display:none" stroke="#2b2440" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M66 104 Q76 91 86 104"/><path d="M114 104 Q124 91 134 104"/>
    </g>
    <ellipse cx="58" cy="124" rx="15" ry="10" fill="url(#cheek)"/><ellipse cx="142" cy="124" rx="15" ry="10" fill="url(#cheek)"/>
    <path id="mouth" d="M92 122 Q100 130 108 122" stroke="#2b2440" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  </svg>
</div>
<footer>Pats: <span id="count">0</span></footer>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="hg" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffd3e0"/><stop offset=".6" stop-color="#ff7aa2"/><stop offset="1" stop-color="#e2507e"/></radialGradient>
    <symbol id="heart3d" viewBox="0 0 32 30"><path d="M16 28 C4 19 0 13 0 8 C0 3 4 0 8.5 0 C12 0 14.5 2 16 4.5 C17.5 2 20 0 23.5 0 C28 0 32 3 32 8 C32 13 28 19 16 28Z" fill="url(#hg)"/><ellipse cx="8" cy="7" rx="4" ry="2.5" fill="#fff" opacity=".7"/></symbol>
  </defs>
</svg>
<script>
  const pet=document.getElementById('pet'),fill=document.getElementById('fill'),mood=document.getElementById('mood'),
        count=document.getElementById('count'),eyes=document.getElementById('eyes'),happy=document.getElementById('happyeyes'),
        mouth=document.getElementById('mouth');
  let pats=0,joy=0,decay;
  const moods=[[0,'Tap me!'],[15,'Hehe ^^'],[40,'More pats pls'],[70,'So happy!!'],[95,'MAX HAPPINESS!']];
  try{pats=+localStorage.getItem('mochi_pats_c')||0}catch(e){}
  count.textContent=pats;
  function render(){
    fill.style.width=joy+'%';
    mood.textContent=moods.filter(m=>joy>=m[0]).pop()[1];
    const glad=joy>=15;
    eyes.style.display=glad?'none':'';happy.style.display=glad?'':'none';
    mouth.setAttribute('d',glad?'M88 120 Q100 138 112 120':'M92 122 Q100 130 108 122');
  }
  function heart(x,y){
    const ns='http://www.w3.org/2000/svg',h=document.createElementNS(ns,'svg'),u=document.createElementNS(ns,'use');
    h.setAttribute('viewBox','0 0 32 30');h.setAttribute('class','heart');u.setAttribute('href','#heart3d');h.appendChild(u);
    h.style.left=(x-15+(Math.random()*40-20))+'px';h.style.top=(y-24)+'px';
    document.body.appendChild(h);setTimeout(()=>h.remove(),1100);
  }
  pet.addEventListener('pointerdown',e=>{
    pats++;count.textContent=pats;try{localStorage.setItem('mochi_pats_c',pats)}catch(_){}
    joy=Math.min(100,joy+7);render();heart(e.clientX,e.clientY);
    pet.classList.remove('idle','bounce');void pet.getBoundingClientRect();pet.classList.add('bounce');
    clearTimeout(decay);decay=setTimeout(()=>pet.classList.add('idle'),420);
  });
  setInterval(()=>{if(joy>0){joy=Math.max(0,joy-2);render();}},800);
  render();
</script>
</body>
</html>
