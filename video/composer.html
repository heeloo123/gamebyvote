<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Reel composer: loads episodes/<ep>/episode.json (?ep=<ep>) and lays out the game screens, captions,
     badges, intro card and vote card at 360x640, scaled 3x to 1080x1920. record.py drives the timeline. -->
<style>
  @font-face{font-family:Fredoka;font-weight:600;src:url(node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2) format("woff2")}
  @font-face{font-family:Fredoka;font-weight:700;src:url(node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2) format("woff2")}
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
  #root{position:absolute;left:0;top:0;width:360px;height:640px;transform:scale(3);transform-origin:0 0;overflow:hidden}
  /* only the current screen (and the next one, warmed up just before it appears) is rendered */
  .game{position:absolute;inset:0;width:100%;height:100%;border:0;display:none}
  .game.warm{display:block;z-index:0}
  .game.on{display:block;z-index:1}
  .layer{position:absolute;inset:0;z-index:2;pointer-events:none;font-family:Fredoka,"Noto Color Emoji",sans-serif}
  /* cards stay display:none until shown, so hidden game thumbnails don't animate in the background */
  .card{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;opacity:0;transition:opacity .35s}
  .card.vis{display:flex}
  .card.on{opacity:1}

  #intro{background:#1f1630;color:#fff}
  #intro .big{font-size:34px;font-weight:700;line-height:1.2}
  #intro .small{margin-top:18px;font-size:16px;color:#c9b8e8;font-weight:600}
  #intro .chips{margin-top:20px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  #intro .chip{background:#ffffff1a;border:1px solid #ffffff33;border-radius:999px;padding:6px 12px;font-size:13px;color:#e8defa}

  .cap{position:absolute;left:14px;right:14px;text-align:center;opacity:0;transform:translateY(10px) scale(.96);transition:opacity .25s,transform .25s}
  .cap.on{opacity:1;transform:none}
  .cap span{display:inline;background:#1f1630;color:#fff;font-weight:700;font-size:24px;line-height:1.55;padding:4px 10px;border-radius:10px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .cap.yellow span{background:#ffcf5c;color:#1f1630}

  .badge{position:absolute;left:50%;top:158px;display:flex;align-items:center;gap:8px;background:#1f1630;color:#fff;border-radius:999px;
         padding:5px 16px 5px 5px;font-weight:700;font-size:18px;opacity:0;transform:translate(-50%,-8px);transition:all .3s;white-space:nowrap}
  .badge.on{opacity:1;transform:translate(-50%,0)}
  .badge i{font-style:normal;width:30px;height:30px;border-radius:50%;background:#ffcf5c;color:#1f1630;display:grid;place-items:center;font-size:18px}

  /* hook: the opening frame, with the choices already moving on screen (no text-only intro) */
  #hook{background:linear-gradient(#2a1f3d,#1f1630);color:#fff;justify-content:center;transition:none}
  #hook .big{font-size:36px;font-weight:700;line-height:1.1}
  #hook .sub{font-size:17px;font-weight:600;margin:10px 0 20px;color:#ffcf5c}
  #hook .opt{opacity:1;transform:none}

  #outro{background:linear-gradient(#2a1f3d,#1f1630);color:#fff;justify-content:flex-start;padding-top:84px}
  #outro .big{font-size:31px;font-weight:700;line-height:1.15}
  #outro .sub{font-size:16px;font-weight:600;margin:8px 0 18px;color:#c9b8e8}
  .opts{display:flex;gap:10px}
  .opt{width:100px;text-align:center;opacity:0;transform:translateY(16px) scale(.95);transition:all .3s}
  .opt.on{opacity:1;transform:none}
  .thumb{position:relative;width:100px;height:178px;border-radius:14px;overflow:hidden;border:3px solid #fff}
  .thumb iframe{position:absolute;left:0;top:0;width:360px;height:640px;border:0;transform:scale(.2722);transform-origin:0 0}
  .opt b{display:block;margin-top:8px;font-size:22px}
  .opt small{display:block;font-size:13px;font-weight:600;color:#c9b8e8}
  .opt em{display:block;margin-top:6px;font-style:normal;font-size:13px;font-weight:700;line-height:1.2;color:#fff}
  .opt em .rw{display:block;color:#9ff0a0}
  .opt em .ct{display:block;margin-top:3px;color:#ff9a8a}
  .opt.hi .thumb{border-color:#ffcf5c;box-shadow:0 0 0 3px #ffcf5c}
  .opt.hi{transform:scale(1.08)}
  .opts.solo .opt:not(.hi){opacity:.25}
  #outro .next{margin-top:22px;font-size:15px;font-weight:600;color:#ffcf5c}
  #outro .handle{margin-top:14px;font-size:17px;font-weight:700;background:#ffcf5c;color:#1f1630;border-radius:999px;padding:8px 18px}
</style>
</head>
<body>
<div id="root">
  <div id="screens"></div>
  <div class="layer" id="overlays"></div>
  <div class="layer card" id="intro"><div class="big"></div><div class="chips"></div><div class="small"></div></div>
  <div class="layer card" id="hook"><div class="big"></div><div class="sub"></div><div class="opts"></div></div>
  <div class="layer card" id="outro"><div class="big"></div><div class="sub"></div><div class="opts"></div><div class="next"></div><div class="handle"></div></div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

  function build(ep) {
    for (const s of ep.screens) {
      const f = el('iframe', 'game'); f.id = 's_' + s.id; f.src = s.src; $('screens').append(f);
      if (s.badge) { const b = el('div', 'badge', `<i>${s.badge.letter}</i>${s.badge.label}`); b.id = 'b_' + s.id; $('overlays').append(b); }
    }
    for (const c of ep.captions) {
      const d = el('div', 'cap' + (c.yellow ? ' yellow' : ''), `<span>${c.html}</span>`);
      d.id = c.id; d.style.top = c.top + 'px'; $('overlays').append(d);
    }
    const i = ep.intro;
    if (i) {
      $('intro').querySelector('.big').innerHTML = i.big;
      i.chips.forEach(t => $('intro').querySelector('.chips').append(el('span', 'chip', t)));
      $('intro').querySelector('.small').innerHTML = i.small;
    }
    const src = Object.fromEntries(ep.screens.map(s => [s.id, s.src]));
    const fill = (card, cfg, prefix) => {
      card.querySelector('.big').innerHTML = cfg.big;
      card.querySelector('.sub').innerHTML = cfg.sub || '';
      cfg.options.forEach((opt, n) => {
        const c = el('div', 'opt'); c.id = prefix + n;
        const thumb = el('div', 'thumb');
        if (opt.screen) { const f = el('iframe'); f.src = src[opt.screen]; thumb.append(f); }
        else if (opt.image) { thumb.innerHTML = `<img src="${opt.image}" style="width:100%;height:100%;object-fit:cover">`; }
        c.append(thumb, el('b', '', opt.letter), el('small', '', opt.label));
        if (opt.result) c.append(el('em', '', opt.result));   // what happens if this option wins
        if (opt.reward) c.append(el('em', '', `<span class="rw">${opt.reward}</span><span class="ct">${opt.cost}</span>`));
        card.querySelector('.opts').append(c);
      });
    };
    const o = ep.outro;
    fill($('outro'), o, 'o');
    if (ep.hook) fill($('hook'), ep.hook, 'h');
    $('outro').querySelector('.next').innerHTML = o.next || '';
    $('outro').querySelector('.handle').innerHTML = o.handle || '';
    if (!o.next) $('outro').querySelector('.next').remove();
    if (!o.handle) $('outro').querySelector('.handle').remove();
  }

  // timeline actions, called by record.py
  window.show = id => {
    const e = $(id);
    if (e.classList.contains('card')) { e.classList.add('vis'); void e.offsetWidth; }
    e.classList.add('on');
  };
  window.hide = id => {
    const e = $(id);
    e.classList.remove('on');
    if (e.classList.contains('card')) setTimeout(() => e.classList.remove('vis'), 400);
  };
  window.showScreen = (id, badge = true) => {
    document.querySelectorAll('.game').forEach(f => { f.classList.toggle('on', f.id === 's_' + id); f.classList.remove('warm'); });
    document.querySelectorAll('.badge').forEach(b => b.classList.toggle('on', badge && b.id === 'b_' + id));
  };
  window.warm = id => $('s_' + id).classList.add('warm');
  window.nobadge = () => document.querySelectorAll('.badge').forEach(b => b.classList.remove('on'));
  // option n: reveal it and spotlight it (others dim); option -1: drop the spotlight, all shown side by side
  window.option = n => {
    const card = $('outro').querySelector('.opts');
    card.querySelectorAll('.opt').forEach(o => o.classList.remove('hi'));
    if (n < 0) { card.classList.remove('solo'); card.querySelectorAll('.opt').forEach(o => o.classList.add('on')); return; }
    card.classList.add('solo'); $('o' + n).classList.add('on', 'hi');
  };
  // "screen:beat" → tells that game screen to play a scripted beat (scenes listen for postMessage({beat}))
  window.cue = arg => { const [s, beat] = arg.split(':'); $('s_' + s).contentWindow.postMessage({ beat }, '*'); };

  const name = new URLSearchParams(location.search).get('ep');
  window.ready = fetch(`episodes/${name}/episode.json`).then(r => r.json()).then(ep => {
    build(ep); showScreen(ep.startScreen, false); if (ep.hook) show('hook'); return true;
  });
</script>
</body>
</html>
